server {
    # IPv4 uniquement, volontairement : le healthcheck du compose interroge
    # 127.0.0.1 et non localhost, qui resout d'abord en ::1 dans le conteneur.
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # L'app n'a pas de routeur (app.config.ts ne fournit pas provideRouter),
    # mais le repli coute une ligne et evite un 404 sur un rafraichissement.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # outputHashing: "all" — le nom porte le contenu, donc le cache peut etre
    # definitif. index.html, lui, ne doit jamais etre garde : c'est lui qui
    # designe les bundles courants.
    location ~* \.(?:js|css|woff2?|ico|png|svg)$ {
        # Un seul en-tete, pas « expires » en plus : les deux emettraient chacun
        # leur Cache-Control et le client recevrait la directive en double.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
